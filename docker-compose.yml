networks:
  toubilib.net:
    driver: bridge

services:
  # service api.toubilib : api pour la prise de rdv
  api.toubilib:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    ports:
      - '7080:80'
    volumes:
      - ./app:/var/php
    env_file: ./app/config/.env
    working_dir: /var/php
    networks:
      - toubilib.net
    depends_on:
      - toubilib.db

    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"


  toubilib.db:
    image: 'postgres:18.6'
    env_file: ./app/config/.env
    ports:
      - '5532:5432'
    networks:
      - toubilib.net
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - toubilib.data:/var/lib/postgresql

  adminer:
    image: adminer
    ports:
      - '8880:8080'
    networks:
      - toubilib.net

volumes:
  toubilib.data: